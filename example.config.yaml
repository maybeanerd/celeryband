# CeleryBand configuration
# All deployment settings must be provided here - no defaults.
#
# Departments reference roles by their lowercase, underscore-separated ID.
# Roles and seniority levels are defined once at the top level and shared
# across departments. Optional "label" fields provide human-readable names
# for the UI — when omitted the identifier is auto-formatted (underscores →
# spaces, title-cased).
#
# Copy this file to config.yaml and mount it into the container:
#   - ./config.yaml:/app/config.yaml:ro

# The URL your server is reachable on (used for login links, etc.)
serverUrl: "http://localhost:3000"

# The domain accepted for signups
acceptedDomain: "celery.band"

# Currency symbol shown alongside salary figures
currency: "€"

# Optional legal disclaimer shown in the footer (null to disable)
disclaimer: null

# --- Departments ---
# Each department has an optional label for display.
# Roles are listed as references to the top-level "roles" definitions.
departments:
  engineering:
    label: "Engineering"
    roles:
      - software_engineer
      - product_manager
      - designer
  sales:
    label: "Sales"
    roles:
      - sales_representative
      - account_manager
  human_resources:
    label: "Human Resources"
    roles:
      - hr_coordinator
      - hr_manager

# --- Roles ---
# Defined once, shared across departments. Each role declares which
# seniority levels it supports.
roles:
  software_engineer:
    label: "Software Engineer"
    seniorityLevels:
      - junior
      - professional
      - senior
      - staff
      - principal
  product_manager:
    label: "Product Manager"
    seniorityLevels:
      - junior
      - professional
      - senior
  designer:
    label: "Designer"
    seniorityLevels:
      - junior
      - professional
      - senior
  sales_representative:
    label: "Sales Representative"
    seniorityLevels:
      - junior
      - professional
      - senior
  account_manager:
    label: "Account Manager"
    seniorityLevels:
      - professional
      - senior
      - staff
  hr_coordinator:
    label: "HR Coordinator"
    seniorityLevels:
      - junior
      - professional
  hr_manager:
    label: "HR Manager"
    seniorityLevels:
      - professional
      - senior
