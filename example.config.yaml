# CeleryBand configuration
# All deployment settings must be provided here - no defaults.
#
# Departments → roles → seniorityLevels define the valid hierarchy.
# Only roles listed under a department are valid for that department.
# Only seniority levels listed under a role are valid for that role.
#
# Copy this file to config.yaml and mount it into the container:
#   - ./config.yaml:/app/config.yaml:ro

# The URL your server is reachable on (used for login links, etc.)
serverUrl: "https://your-org.celery.band"

# The domain accepted for signups
acceptedDomain: "celery.band"

# Currency symbol shown alongside salary figures
currency: "€"

# Optional legal disclaimer shown in the footer (null to disable)
disclaimer: null

departments:
  engineering:
    roles:
      software engineer:
        seniorityLevels:
          - junior
          - professional
          - senior
          - staff
          - principal
      product manager:
        seniorityLevels:
          - junior
          - professional
          - senior
      designer:
        seniorityLevels:
          - junior
          - professional
          - senior
  sales:
    roles:
      sales representative:
        seniorityLevels:
          - junior
          - professional
          - senior
      account manager:
        seniorityLevels:
          - professional
          - senior
          - staff
  human resources:
    roles:
      hr coordinator:
        seniorityLevels:
          - junior
          - professional
      hr manager:
        seniorityLevels:
          - professional
          - senior
